<!DOCTYPE html>
<html>
<body style="margin: 0; padding: 0; background-color: #0D0D0D; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;">
  <table width="100%" cellpadding="0" cellspacing="0" style="padding: 40px 20px;">
    <tr>
      <td align="center">
        <table width="480" cellpadding="0" cellspacing="0" style="background-color: #161616; border-radius: 20px; border: 1px solid rgba(255,255,255,0.07); overflow: hidden;">

          <!-- Header -->
          <tr>
            <td align="center" style="padding: 32px 40px 24px;">
              <p style="margin: 0; font-size: 22px; font-weight: 800; color: #00D6A0; letter-spacing: -0.5px;">SplitNow</p>
            </td>
          </tr>

          <!-- Divider -->
          <tr>
            <td style="height: 1px; background-color: rgba(255,255,255,0.07);"></td>
          </tr>

          <!-- Body -->
          <tr>
            <td align="center" style="padding: 36px 40px;">
              <p style="margin: 0 0 8px; font-size: 18px; font-weight: 700; color: #F8F8F6;">Your sign-in code</p>
              <p style="margin: 0 0 28px; font-size: 14px; color: #9E9C94; line-height: 1.5;">Enter this code in SplitNow to sign in. It expires in 10 minutes.</p>

              <!-- OTP box -->
              <div style="display: inline-block; background-color: #1C1C1C; border: 1px solid rgba(0,214,160,0.25); border-radius: 14px; padding: 20px 44px;">
                <p style="margin: 0; font-size: 38px; font-weight: 800; letter-spacing: 10px; color: #00D6A0; font-family: 'Courier New', monospace;">{{ .Token }}</p>
              </div>

              <p style="margin: 28px 0 0; font-size: 13px; color: #97958C;">Do not share this code with anyone. SplitNow will never ask for it.</p>
            </td>
          </tr>

          <!-- Divider -->
          <tr>
            <td style="height: 1px; background-color: rgba(255,255,255,0.07);"></td>
          </tr>

          <!-- Footer -->
          <tr>
            <td align="center" style="padding: 20px 40px;">
              <p style="margin: 0; font-size: 12px; color: #97958C;">
                If you didn't request this, you can safely ignore this email.<br/>
                &copy; 2026 SplitNow &nbsp;·&nbsp;
                <a href="https://splitnow.vertazon.com/privacy" style="color: #97958C;">Privacy Policy</a>
              </p>
            </td>
          </tr>

        </table>
      </td>
    </tr>
  </table>
</body>
</html>
